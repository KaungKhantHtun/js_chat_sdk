<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Chat Overlay Demo</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000
    }
  </style>
</head>

<body>


  <!-- <script src="../dist/index.global.js"></script> -->

  <script src="https://kaungkhanthtun.github.io/js_chat_sdk/dist/index.global.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const chat = window.ChatOverlay.init({
        title: 'Support',
        greeting: 'Hello! How can I help you ?',
        position: 'right',
        hint: 'Ask anything',
        theme: { accent: '#053345' },
        onSend: async (text) => {
          await new Promise(r => setTimeout(r, 400))
          if (/help|price|plan/i.test(text)) {
            return 'We offer Free and Pro plans. Type "pricing" to learn more.'
          }
          return `You said: ${text}`
        }
      });
      setTimeout(() => chat.open(), 1500)
    });
  </script>
</body>

</html>s
