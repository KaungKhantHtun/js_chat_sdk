<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Chat Overlay Demo</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
    }
  </style>
</head>

<body>


  <script src="../dist/index.global.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // ChatOverlay is attached to window by the IIFE
      const chat = window.ChatOverlay.init({
        title: 'Support',
        greeting: 'Hello! Ask me anything ✨',
        position: 'right',
        theme: { accent: '#22c55e' }, // lime/green
        onSend: async (text) => {
          // Fake latency + echo. Replace with a real API call.
          await new Promise(r => setTimeout(r, 400))
          if (/help|price|plan/i.test(text)) {
            return 'We offer Free and Pro plans. Type "pricing" to learn more.'
          }
          return `You said: ${text}`
        }
      });


      chat.open();
    });
  </script>
</body>

</html>
